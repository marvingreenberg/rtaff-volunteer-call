name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: volunteer_call
          POSTGRES_PASSWORD: volunteer_call_test
          POSTGRES_DB: volunteer_call_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make setup-backend

      - name: Run linters
        run: make lint-be

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://volunteer_call:volunteer_call_test@localhost:5432/volunteer_call_test
          JWT_SECRET: ci-jwt-secret-not-for-production
        run: make test-backend

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: backend/coverage.xml
          flags: backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: make setup-frontend

      - name: Run linter and type check
        run: make lint-fe

      - name: Run tests
        run: make test-frontend

  type-generation:
    runs-on: ubuntu-latest
    needs: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: volunteer_call
          POSTGRES_PASSWORD: volunteer_call_test
          POSTGRES_DB: volunteer_call_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://volunteer_call:volunteer_call_test@localhost:5432/volunteer_call_test
          JWT_SECRET: ci-jwt-secret-not-for-production
        run: |
          uvicorn volunteer_call_api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Generate types
        working-directory: frontend
        run: pnpm run generate-types

      - name: Verify types generated
        working-directory: frontend
        run: |
          if [ ! -f src/lib/api/types.ts ]; then
            echo "Type generation failed - types.ts not created"
            exit 1
          fi
          echo "Types generated successfully"
          head -50 src/lib/api/types.ts

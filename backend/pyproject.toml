[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volunteer-call-api"
dynamic = ["version"]
description = "RT-AFF Volunteer Call Notification System API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "psycopg2",
    "jinja2>=3.1.0",
    "aiosmtplib>=2.0.0",
    "email-validator>=2.0.0",
    # Calendar conflict detection: fetch user iCal URLs + parse VEVENTs.
    "httpx>=0.26.0",
    "icalendar>=5.0.0",
]

# Keep in sync with [dependency-groups] dev below (pip compat for non-uv envs)
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["icalendar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--cov=volunteer_call_api", "--cov-report=html", "--cov-report=term"]

[tool.setuptools_scm]
root = ".."

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["C901", "E", "W"]

[tool.ruff.lint.per-file-ignores]
"src/volunteer_call_api/alembic/**" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.coverage.run]
omit = ["tests/*"]
